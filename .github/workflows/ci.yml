name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pnpm
        run: npm install -g pnpm@11.7.0

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install triad (Python) with dev dependencies
        run: python -m pip install -e "packages/triad[dev]"

      - name: Typecheck
        run: pnpm typecheck

      # Runs every workspace test script, including the triad unittest suite.
      - name: Test
        run: pnpm test
        env:
          TRIAD_SKIP_REAL_DOCKER: "1"

  # Real containers running hostile-looking code. Informational until the two runner-specific
  # failures are understood; it stays visible in the PR checks instead of being skipped silently.
  docker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "packages/triad[dev]"
      - run: python -m unittest triad.tests.test_docker_runner.TestDockerRunnerRealIsolation -v
        working-directory: packages/triad
