name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pnpm
        run: npm install -g pnpm@11.7.0

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install triad (Python) with dev dependencies
        run: python -m pip install -e "packages/triad[dev]"

      - name: Typecheck
        run: pnpm typecheck

      # Runs every workspace test script, including the triad unittest suite.
      - name: Test
        run: pnpm test
